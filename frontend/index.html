<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- a phone app: no pinch or double-tap zoom, drawn under the notch / home bar (safe areas are kept in styles.css),
         and the keyboard opens over the page instead of pushing the tab bar up -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content" />
    <meta name="author" content="Zenatiq Solutions" />
    <link rel="icon" href="/icons/m-64.png" type="image/png" />
    <!-- installed on a phone (Add to Home Screen): opens full screen like an app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1B2A4E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mizdoo POS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/icons/m-180.png" />
    <title>Mizdoo Clothing POS</title>
    <script>
      // set the theme before anything draws, so someone who chose dark never sees a white flash
      (function () {
        var dark = false;   // light is the default
        try { dark = localStorage.getItem('cargo-pos-theme') === 'dark'; } catch (e) {}
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
