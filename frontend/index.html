<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Cargo POS</title>
    <script>
      // set the theme before anything draws, so someone who chose dark never sees a white flash
      (function () {
        var dark = false;   // light is the default
        try { dark = localStorage.getItem('cargo-pos-theme') === 'dark'; } catch (e) {}
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
